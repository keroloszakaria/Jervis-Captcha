name: Embedded PHP package

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'composer.json'
      - 'packages/php/**'
      - 'packages/frontend/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'scripts/copy-assets.mjs'
      - 'scripts/check-composer-manifests.php'
      - 'scripts/package-embedded.py'
      - '.github/workflows/php-embedded.yml'
  pull_request:
    paths:
      - 'composer.json'
      - 'packages/php/**'
      - 'packages/frontend/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'scripts/copy-assets.mjs'
      - 'scripts/check-composer-manifests.php'
      - 'scripts/package-embedded.py'
      - '.github/workflows/php-embedded.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-php-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin dependency resolver
        run: npm install --global npm@11.19.1
      - name: Install locked browser dependencies
        run: npm ci
      - name: Typecheck and unit test package source
        run: |
          npm run typecheck
          npm test
      - name: Build the exact package browser artifacts
        run: npm run build
      - name: Validate npm distribution candidate
        run: |
          test -s packages/frontend/dist/jervis-captcha.js
          test -s packages/frontend/dist/index.d.ts
          npm pack ./packages/frontend --dry-run
      - name: Stage artifacts with stable repository-relative paths
        shell: bash
        run: |
          rm -rf .embedded-package-assets
          mkdir -p .embedded-package-assets/packages/php/resources .embedded-package-assets/packages/frontend
          cp -a packages/php/resources/dist .embedded-package-assets/packages/php/resources/dist
          cp -a packages/frontend/dist .embedded-package-assets/packages/frontend/dist
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-package-assets
          path: .embedded-package-assets/
          retention-days: 3
          if-no-files-found: error

  php-package:
    needs: web-package
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            label: '11'
            laravel: '^11.45.2'
            testbench: '^9.15'
          - php: '8.2'
            label: '12'
            laravel: '^12.40.0'
            testbench: '^10.8'
          - php: '8.4'
            label: '13'
            laravel: '^13.23.0'
            testbench: '^11.2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: embedded-package-assets
          path: .embedded-assets
      - name: Replace checked-in fallback with the verified build under test
        shell: bash
        run: |
          rm -rf packages/php/resources/dist packages/frontend/dist
          mkdir -p packages/php/resources/dist packages/frontend/dist
          cp -a .embedded-assets/packages/php/resources/dist/. packages/php/resources/dist/
          cp -a .embedded-assets/packages/frontend/dist/. packages/frontend/dist/
          test -s packages/php/resources/dist/jervis-captcha.js
          test -s packages/frontend/dist/jervis-captcha.js
          test -s packages/frontend/dist/index.d.ts
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          tools: composer:v2
          coverage: none
      - name: Validate manifests and PHP syntax
        run: |
          php scripts/check-composer-manifests.php
          composer validate --strict
          (cd packages/php && composer validate --strict)
          find packages/php/src packages/php/tests packages/php/config -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Pin Laravel generation under test
        env:
          LARAVEL_CONSTRAINT: ${{ matrix.laravel }}
          TESTBENCH_CONSTRAINT: ${{ matrix.testbench }}
        run: |
          composer require --dev --no-update "laravel/framework:${LARAVEL_CONSTRAINT}" "orchestra/testbench:${TESTBENCH_CONSTRAINT}"
          composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies
      - name: Audit Composer dependencies
        run: composer audit
      - name: Run embedded engine and Laravel integration tests
        run: composer test
      - name: Record resolved framework versions
        if: always()
        run: |
          composer show laravel/framework || true
          composer show orchestra/testbench || true

  offline-distribution:
    needs: [web-package, php-package]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: embedded-package-assets
          path: .embedded-assets
      - name: Use the same verified browser artifacts accepted by package tests
        shell: bash
        run: |
          rm -rf packages/php/resources/dist packages/frontend/dist
          mkdir -p packages/php/resources/dist packages/frontend/dist
          cp -a .embedded-assets/packages/php/resources/dist/. packages/php/resources/dist/
          cp -a .embedded-assets/packages/frontend/dist/. packages/frontend/dist/
      - name: Build offline Composer and frontend archives
        run: python3 scripts/package-embedded.py
      - name: Validate archive structure and checksums
        shell: bash
        run: |
          test -s dist/embedded/manifest.json
          test -s dist/embedded/SHA256SUMS
          (cd dist/embedded && sha256sum -c SHA256SUMS)
          unzip -l dist/embedded/jervis-captcha-php-*.zip | grep -q 'composer.json'
          unzip -l dist/embedded/jervis-captcha-php-*.zip | grep -q 'resources/dist/jervis-captcha.js'
          tar -tzf dist/embedded/jervis-captcha-frontend-*.tgz | grep -q 'package/package.json'
          tar -tzf dist/embedded/jervis-captcha-frontend-*.tgz | grep -q 'package/dist/jervis-captcha.js'
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-offline-distributions
          path: dist/embedded/
          retention-days: 30
          if-no-files-found: error
