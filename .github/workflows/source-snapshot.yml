name: Maintainer source snapshot
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths: ['.github/workflows/source-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only Git-tracked source, without credentials or customer data
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=Jervis-Captcha/ HEAD -o "$RUNNER_TEMP/captcha-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: maintainer-source
          path: ${{ runner.temp }}/captcha-source.tar.gz
          retention-days: 1
          if-no-files-found: error
